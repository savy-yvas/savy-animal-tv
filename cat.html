<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>每日猫猫视频</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f4ed;
    text-align: center;
    padding: 40px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    font-size: 38px;
}

.subtitle {
    color: #666;
    margin-bottom: 25px;
}

image {
    width: 100%;
    max-height: 70vh;
    border-radius: 20px;
    background: black;
}

button {
    margin-top: 25px;
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

.status {
    color: #777;
    margin-top: 15px;
}
.back-btn {
    position: fixed;
    top: 25px;
    left: 25px;
    text-decoration: none;
    background: white;
    color: #222;
    padding: 10px 18px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    font-size: 16px;
}

.back-btn:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">

<h1>🐱 今日猫猫视频 🐱</h1>

<p class="subtitle">
随机猫猫随机治愈
</p>

<img
id="catImage"
style="
width:75%;
max-width:700px;
border-radius:20px;
margin-top:20px;
"
/>

<br>

<button onclick="loadCat(true)">
换一只猫猫</button>

<p class="status" id="status">
正在寻找猫猫...
</p>

<a class="back-btn" href="index.html">
← 返回首页
</a>

</div>

<script>
const image = document.getElementById("catImage");
const statusText = document.getElementById("status");

const today = new Date().toDateString();

async function loadCat(force = false) {

    const savedDate =
        localStorage.getItem("catDate");

    const savedimage =
        localStorage.getItem("catImage");

    if (
        !force &&
        savedDate === today &&
        savedImage
    ) {
        Image.src = savedImage;
        statusText.innerText =
            "这是今天的幸运猫猫。";
        return;
    }

    statusText.innerText =
        "正在寻找今日猫猫...";

    try {

        const response =
            await fetch(
              "https://api.thecatapi.com/v1/images/search?mime_types=gif"
            );

        const data =
            await response.json();

        image.src = data[0].url;

        localStorage.setItem(
            "catImage",
            data.url
        );

        localStorage.setItem(
            "catDate",
            today
        );

        statusText.innerText =
            "今日猫猫已送达。";

    } catch(error) {

        statusText.innerText =
            "猫猫加载失败，请稍后再试。";

        console.error(error);
    }
}

loadcat();
</script>

</body>
</html>
